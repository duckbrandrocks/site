<style>
:root{
  color-scheme: light;
  --bg:#FFF6DF; --surface:#FFFBF0; --panel:#F5E8C4; --ink:#13262B; --muted:#4A5E66;
  --line:rgba(19,38,43,.18); --on-ink:#FFF6DF; --yellow:#FFC81A; --orange:#EE7A1C;
  --band-bg:#FFC81A; --band-ink:#13262B; --scrim:rgba(19,38,43,.45);
  --tee-stroke:rgba(19,38,43,.35);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#13262B; --surface:#1A2F35; --panel:#21383F; --ink:#FFF6DF; --muted:#C9C2AF;
    --line:rgba(255,246,223,.18); --on-ink:#13262B; --scrim:rgba(0,0,0,.6);
    --tee-stroke:rgba(255,246,223,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#13262B; --surface:#1A2F35; --panel:#21383F; --ink:#FFF6DF; --muted:#C9C2AF;
  --line:rgba(255,246,223,.18); --on-ink:#13262B; --scrim:rgba(0,0,0,.6);
  --tee-stroke:rgba(255,246,223,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:4px}
.wrap{max-width:1360px;margin:0 auto;padding:0 clamp(20px,4vw,48px)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* logo swaps with theme */
.logo-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo-light{display:none}:root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none}:root[data-theme="dark"] .logo-dark{display:block}

/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.site-header.scrolled{border-bottom-color:var(--line)}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px 32px;min-height:76px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.brand{display:flex;align-items:center;min-height:44px}
.brand img{height:34px;width:auto}
.nav{display:flex;gap:4px 28px;font-weight:600;font-size:16px;flex-wrap:wrap}
.nav a{text-decoration:none;padding:12px 0;position:relative}
.nav a[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:3px;border-radius:2px;background:var(--yellow)}
.bag-btn{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 18px;border:2px solid var(--ink);border-radius:999px;background:transparent;font-weight:700;cursor:pointer}
.bag-count{min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--yellow);color:#13262B;font-size:13px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.bag-btn.bump .bag-count{animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{40%{transform:scale(1.35)}}
@media (max-width:720px){
  .nav{order:3;width:100%;gap:0 22px;font-size:15px}
  .brand img{height:28px}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;font-weight:700;font-size:16px;text-decoration:none;cursor:pointer;border:2px solid var(--ink);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--ink);color:var(--on-ink)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-block{width:100%}

/* type */
.display{font-weight:900;letter-spacing:-.045em;line-height:.9;margin:0}
.h2{font-weight:900;letter-spacing:-.04em;line-height:1;margin:0;font-size:clamp(2.4rem,5.5vw,4.5rem)}
.lede{font-size:clamp(1.1rem,1.6vw,1.35rem);line-height:1.5;max-width:34em;margin:0}
.muted{color:var(--muted)}

/* tee */
.tee{position:relative}
.tee svg{width:100%;height:auto;display:block}
.tee .mark{position:absolute;height:auto}

/* hero */
.hero{padding:clamp(32px,6vw,72px) 0 clamp(64px,9vw,112px)}
.hero h1{font-size:clamp(3.4rem,10.5vw,10rem);max-width:11ch}
.hero-row{display:flex;gap:clamp(6px,2vw,28px);align-items:flex-end;margin:clamp(36px,5vw,64px) 0 clamp(32px,4vw,48px)}
.hero-row .tee-btn{flex:1 1 0;min-width:0;background:none;border:0;padding:0;cursor:pointer;border-radius:12px;animation:drop .7s cubic-bezier(.3,1.4,.5,1) both}
.hero-row .tee-btn.waddle{animation:waddle .6s ease-in-out}
@keyframes drop{0%{opacity:0;transform:translateY(-30px) rotate(-4deg)}60%{opacity:1;transform:translateY(4px) rotate(2deg)}100%{opacity:1;transform:none}}
@keyframes waddle{20%{transform:rotate(-5deg)}45%{transform:rotate(5deg)}70%{transform:rotate(-3deg)}100%{transform:none}}
.hero-foot{display:flex;flex-wrap:wrap;gap:28px 64px;align-items:flex-end;justify-content:space-between}

/* product grid */
.section{padding:clamp(64px,9vw,112px) 0}
.section-top{border-top:2px solid var(--ink)}
.section-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px 40px;margin-bottom:clamp(32px,4vw,52px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:clamp(40px,4vw,56px) clamp(20px,2.4vw,32px)}
.card{text-decoration:none;display:flex;flex-direction:column;gap:14px}
.card-media{background:var(--panel);border-radius:20px;padding:12% 13% 9%;transition:transform .25s}
.card:hover .card-media{transform:translateY(-4px) rotate(-.6deg)}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.card h3{margin:0;font-size:23px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.price{font-weight:700;white-space:nowrap}
.dots{display:flex;gap:6px;align-items:center}
.dot{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--tee-stroke)}

/* made band */
.made{background:#13262B;color:#FFF6DF}
.made-inner{display:flex;flex-wrap:wrap;gap:64px;align-items:center}
.made h2{max-width:11ch;margin-bottom:44px}
.made-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:32px 40px}
.made h3{margin:0 0 8px;font-size:19px;font-weight:800;color:#FFC81A}
.made p{margin:0;color:#D9D2BF;font-size:16px;line-height:1.55}
.made-badge{width:min(100%,420px);aspect-ratio:1;border-radius:50%;background:#FFF6DF;display:flex;align-items:center;justify-content:center;margin:0 auto}
.made-badge img{height:66%;width:auto}
:root[data-theme="dark"] .made{background:var(--surface)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .made{background:var(--surface)}}

/* band */
.band{background:var(--band-bg);color:var(--band-ink)}
.band-inner{display:flex;flex-wrap:wrap;gap:28px 64px;align-items:flex-end;justify-content:space-between}
.field{display:flex;flex-direction:column;gap:8px;flex:1 1 420px;min-width:0}
.field label{font-weight:700;font-size:15px}
.field-row{display:flex;flex-wrap:wrap;gap:12px}
.field input{flex:1 1 240px;min-width:0;min-height:56px;padding:0 22px;border:2px solid #13262B;border-radius:999px;background:#FFF6DF;color:#13262B;font:inherit}
.band .btn-primary{background:#13262B;color:#FFF6DF;border-color:#13262B}
.form-msg{margin:4px 0 0;font-weight:600;min-height:1.5em}

/* product page */
.crumbs{font-size:15px;padding-top:24px}
.crumbs a{text-decoration:none;font-weight:600}
.pdp{display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,72px);padding:24px 0 clamp(64px,8vw,96px)}
.pdp-media{flex:1 1 520px;min-width:0;background:var(--panel);border-radius:28px;padding:clamp(28px,7%,72px)}
.pdp-info{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:24px}
.pdp-info h1{font-size:clamp(2.6rem,5vw,4.25rem)}
.opt-label{font-weight:700;font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between}
.swatches{display:flex;gap:4px;flex-wrap:wrap}
.swatch{width:48px;height:48px;padding:0;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:50%}
.swatch span{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--tee-stroke)}
.swatch[aria-checked="true"] span{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.size{min-height:48px;border:2px solid var(--line);border-radius:12px;background:transparent;font-weight:700;cursor:pointer}
.size[aria-checked="true"]{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.size-hint{font-size:15px;margin:10px 0 0}
.error{color:var(--orange);font-weight:700;font-size:15px;margin:10px 0 0;min-height:1.4em}
.buy-row{display:flex;gap:12px;flex-wrap:wrap}
.qty{display:flex;align-items:center;border:2px solid var(--ink);border-radius:999px;min-height:52px}
.qty button{width:44px;height:48px;border:0;background:none;font-size:20px;font-weight:700;cursor:pointer;border-radius:999px}
.qty output{min-width:28px;text-align:center;font-weight:700}
.acc{border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:56px;font-weight:700}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-size:24px;font-weight:500;transition:transform .2s}
.acc details[open] summary::after{transform:rotate(45deg)}
.acc p{margin:0 0 20px;color:var(--muted);max-width:36em}

/* story */
.story{display:flex;flex-wrap:wrap;gap:clamp(32px,6vw,96px);align-items:center;padding:clamp(48px,7vw,96px) 0}
.story-text{flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:22px}
.story-text p{margin:0;max-width:34em;font-size:18px}
.story-art{flex:1 1 320px;min-width:0}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:90;transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility .3s;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);visibility:hidden}
.drawer.open{transform:none;visibility:visible;box-shadow:-20px 0 60px rgba(0,0,0,.18)}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:0;font-size:24px;font-weight:900;letter-spacing:-.03em}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.drawer-body{flex:1;overflow-y:auto;padding:8px 24px}
.line{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.line-media{background:var(--panel);border-radius:12px;padding:10px}
.line h3{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em}
.line-meta{font-size:14px;margin:2px 0 10px}
.line-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.line .qty{min-height:40px;border-width:1.5px}
.line .qty button{width:36px;height:36px;font-size:17px}
.link-btn{background:none;border:0;padding:8px 0;text-decoration:underline;cursor:pointer;font-size:14px;color:var(--muted)}
.drawer-foot{padding:20px 24px 24px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:19px}
.empty{text-align:center;padding:56px 12px;display:flex;flex-direction:column;align-items:center;gap:16px}
.empty img{height:120px;width:auto}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--on-ink);padding:14px 22px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:100;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* footer */
.site-footer{padding:48px 0 56px}
.footer-row{display:flex;flex-wrap:wrap;gap:24px 48px;align-items:center;justify-content:space-between}
.footer-row nav{display:flex;flex-wrap:wrap;gap:0 28px;font-size:15px;font-weight:500}
.footer-row nav a{padding:12px 0}
.site-footer img{height:28px;width:auto}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

  var PRODUCTS = [
    { id:'peking-performance', name:'Peking performance.', lines:['Peking','performance.'], colours:['ink','cream','orange'],

  var byId = {}; PRODUCTS.forEach(function(p){ byId[p.id]=p; });

  /* ---------- helpers ---------- */
  function $(s,r){ return (r||document).querySelector(s); }
  function money(n){ return STORE.currency + n.toFixed(Number.isInteger(n)?0:2); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

  function tee(colourKey, opts){
    opts = opts || {};
    var c = COLOURS[colourKey];
    var pun = '';
    if (opts.lines){
      var fs = Math.min(30, Math.round(140/(Math.max(opts.lines[0].length, opts.lines[1].length)*0.56)));
      pun = '<text x="150" y="150" text-anchor="middle" fill="'+c.ink+'" font-family="Archivo, Arial, sans-serif" font-weight="900" font-size="'+fs+'" letter-spacing="-1">'+esc(opts.lines[0])+'</text>'+
            '<text x="150" y="'+(150+fs*1.12).toFixed(0)+'" text-anchor="middle" fill="'+c.ink+'" font-family="Archivo, Arial, sans-serif" font-weight="900" font-size="'+fs+'" letter-spacing="-1">'+esc(opts.lines[1])+'</text>';
    }
    var mark = opts.lines
      ? '<img class="mark" src="'+DUCK+'" alt="" style="left:64%;top:72%;width:9%">'
      : '<img class="mark" src="'+DUCK+'" alt="" style="left:39%;top:24%;width:22%">';
    return '<div class="tee"'+(opts.label?' role="img" aria-label="'+esc(opts.label)+'"':'')+'>'+
      '<svg viewBox="0 0 300 320" aria-hidden="true"><path d="M96 22 L58 36 L12 80 L44 124 L72 106 L72 302 L228 302 L228 106 L256 124 L288 80 L242 36 L204 22 Q188 52 150 52 Q112 52 96 22 Z" fill="'+c.hex+'" stroke="var(--tee-stroke)" stroke-width="2.5" stroke-linejoin="round"/>'+
      '<path d="M96 22 Q112 52 150 52 Q188 52 204 22" fill="none" stroke="var(--tee-stroke)" stroke-width="3"/>'+pun+'</svg>'+mark+'</div>';
  }

  /* ---------- bag (kept in this browser) ---------- */
  var bag = [];
  try { bag = JSON.parse(localStorage.getItem('duckbrand-bag') || '[]') || []; } catch(e){ bag = []; }
  bag = bag.filter(function(l){ return byId[l.id] && COLOURS[l.colour]; });
  function saveBag(){ try { localStorage.setItem('duckbrand-bag', JSON.stringify(bag)); } catch(e){} }
  function bagQty(){ return bag.reduce(function(n,l){ return n+l.qty; },0); }

  function addToBag(id, colour, size, qty){
    var found = bag.find(function(l){ return l.id===id && l.colour===colour && l.size===size; });
    if (found) found.qty += qty; else bag.push({ id:id, colour:colour, size:size, qty:qty });
    saveBag(); renderBag();
    var b = $('#bagBtn'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
  }

  function renderBag(){
    var n = bagQty();
    $('#bagCount').textContent = n;
    $('#bagLabel').textContent = n===1 ? 'item' : 'items';
    var body = $('#drawerBody'), foot = $('#drawerFoot');
    if (!bag.length){
      body.innerHTML = '<div class="empty"><img src="'+DUCK+'" alt=""><p style="margin:0;font-weight:800;font-size:20px">Your bag is empty.</p><p class="muted" style="margin:0">The ducks are waiting.</p><a class="btn btn-primary" href="#/shop" data-close>Shop the tees</a></div>';
      foot.innerHTML = '';
      return;
    }
    body.innerHTML = bag.map(function(l,i){
      var p = byId[l.id], c = COLOURS[l.colour];
      return '<div class="line"><div class="line-media">'+tee(l.colour,{lines:p.lines})+'</div><div>'+
        '<h3>'+esc(p.name)+'</h3><p class="line-meta muted">'+c.name+' · '+l.size+'</p>'+
        '<div class="line-row"><div class="qty" role="group" aria-label="Quantity for '+esc(p.name)+'">'+
        '<button type="button" data-dec="'+i+'" aria-label="Remove one">−</button><output aria-live="polite">'+l.qty+'</output>'+
        '<button type="button" data-inc="'+i+'" aria-label="Add one">+</button></div>'+
        '<span class="price">'+money(STORE.price*l.qty)+'</span></div>'+
        '<button type="button" class="link-btn" data-remove="'+i+'">Remove</button></div></div>';
    }).join('');
    foot.innerHTML = '<div class="total"><span>Subtotal</span><span>'+money(STORE.price*n)+'</span></div>'+
      '<p class="muted" style="margin:0;font-size:14px">Shipping and taxes are worked out at checkout.</p>'+
      '<button class="btn btn-primary btn-block" type="button" id="checkoutBtn">Check out</button>';
  }

  var lastFocus = null;
  function openDrawer(){
    lastFocus = document.activeElement;
    $('#drawer').classList.add('open'); $('#scrim').classList.add('open');
    $('#drawer').setAttribute('aria-hidden','false');
    document.body.style.overflow='hidden';
    setTimeout(function(){ $('#closeDrawer').focus(); }, 50);
  }
  function closeDrawer(){
    $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open');
    $('#drawer').setAttribute('aria-hidden','true');
    document.body.style.overflow='';
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  $('#bagBtn').addEventListener('click', openDrawer);
  $('#closeDrawer').addEventListener('click', closeDrawer);
  $('#scrim').addEventListener('click', closeDrawer);
  document.addEventListener('keydown', function(e){ if (e.key==='Escape' && $('#drawer').classList.contains('open')) closeDrawer(); });
  $('#drawer').addEventListener('click', function(e){
    var t = e.target.closest('button,a'); if (!t) return;
    if (t.hasAttribute('data-close')) { closeDrawer(); return; }
    if (t.dataset.inc){ bag[+t.dataset.inc].qty++; }
    else if (t.dataset.dec){ var l=bag[+t.dataset.dec]; l.qty--; if (l.qty<1) bag.splice(+t.dataset.dec,1); }
    else if (t.dataset.remove){ bag.splice(+t.dataset.remove,1); }
    else if (t.id==='checkoutBtn'){ toast(STORE.checkoutMessage, 5200); return; }
    else return;
    saveBag(); renderBag();
  });

  var toastTimer;

  }

  function card(p){

  function shopSection(isPage){

  function madeSection(){
    return '<section class="made section" aria-labelledby="made-title"><div class="wrap made-inner">'+
      '<div style="flex:1 1 380px;min-width:0"><h2 class="h2" id="made-title">Seriously made. Not seriously meant.</h2>'+
      '<div class="made-grid">'+
      '<div><h3>Heavyweight cotton</h3><p>A dense, structured knit that keeps its shape wash after wash, and feels like it cost what it did.</p></div>'+
      '<div><h3>Small-run printing</h3><p>Each design is printed in limited batches, so the joke stays yours and doesn’t turn up on everyone at brunch.</p></div>'+
      '<div><h3>The duck on the hem</h3><p>Every shirt carries our duck, hard hat and shades included, stitched small near the hem. People who know, know.</p></div>'+
      '<div><h3>A cut that flatters</h3><p>Relaxed through the body, clean at the shoulder. Smart enough for dinner, if the dinner has a sense of humour.</p></div>'+
      '</div></div><div style="flex:1 1 340px;min-width:0"><div class="made-badge"><img src="'+DUCK+'" alt="The Duck Brand duck, in a hard hat and sunglasses"></div></div>'+
      '</div></section>';
  }

  var pdpState = {};
  function viewProduct(id){
    var p = byId[id]; if (!p) return viewNotFound();
    pdpState = { id:id, colour:p.colours[0], size:null, qty:1 };
    var others = PRODUCTS.filter(function(x){ return x.id!==id; }).slice(0,3);
    return '<div class="wrap"><nav class="crumbs" aria-label="Breadcrumb"><a href="#/shop">Shop</a> <span class="muted">/ '+esc(p.name)+'</span></nav>'+
      '<div class="pdp"><div class="pdp-media" id="pdpMedia">'+tee(pdpState.colour,{lines:p.lines,label:p.name+' tee in '+COLOURS[pdpState.colour].name})+'</div>'+
      '<div class="pdp-info"><div><h1 class="display" tabindex="-1">'+esc(p.name)+'</h1>'+
      '<p style="font-size:22px;font-weight:800;margin:16px 0 0">'+money(STORE.price)+'</p></div>'+
      '<p class="lede" style="font-size:18px">'+esc(p.story)+'</p>'+
      '<div><p class="opt-label" id="colourLabel"><span>Colour</span><span class="muted" id="colourName">'+COLOURS[pdpState.colour].name+'</span></p>'+
      '<div class="swatches" role="radiogroup" aria-labelledby="colourLabel">'+p.colours.map(function(k,i){
        return '<button type="button" class="swatch" role="radio" aria-checked="'+(i===0)+'" aria-label="'+COLOURS[k].name+'" data-colour="'+k+'"><span style="background:'+COLOURS[k].hex+'"></span></button>';
      }).join('')+'</div></div>'+
      '<div><p class="opt-label" id="sizeLabel"><span>Size</span></p>'+
      '<div class="sizes" role="radiogroup" aria-labelledby="sizeLabel">'+STORE.sizes.map(function(s){
        return '<button type="button" class="size" role="radio" aria-checked="false" data-size="'+s+'">'+s+'</button>';
      }).join('')+'</div>'+
      '<p class="size-hint muted">Relaxed fit. Between sizes? Size down for a cleaner line.</p>'+
      '<p class="error" id="sizeError" role="alert"></p></div>'+
      '<div class="buy-row"><div class="qty" role="group" aria-label="Quantity"><button type="button" id="qDec" aria-label="Remove one">−</button><output id="qOut" aria-live="polite">1</output><button type="button" id="qInc" aria-label="Add one">+</button></div>'+
      '<button class="btn btn-primary" type="button" id="addBtn" style="flex:1 1 220px">Add to bag</button></div>'+
      '<div class="acc">'+
      '<details><summary>Details and fit</summary><p>Heavyweight cotton jersey with a relaxed body and clean shoulder line. The pun is printed on the chest and our duck is stitched near the hem.</p></details>'+
      '<details><summary>Care</summary><p>Wash cold, inside out. Line dry in the shade. Iron on the reverse, never over the print. Treat it well and the joke lasts for years.</p></details>'+
      '<details><summary>Shipping and returns</summary><p>Delivery options and costs are shown at checkout. Changed your mind? Unworn tees can be returned. See shipping and returns for the details.</p></details>'+
      '</div></div></div>'+
      '<section class="section section-top" aria-labelledby="more-title" style="padding-top:64px"><div class="section-head"><h2 class="h2" id="more-title" style="font-size:clamp(2rem,4vw,3rem)">More from the flock</h2></div>'+
      '<div class="grid">'+others.map(card).join('')+'</div></section></div>';
  }

  function bindProduct(){
    var p = byId[pdpState.id];
    document.querySelectorAll('.swatch').forEach(function(b){
      b.addEventListener('click', function(){
        pdpState.colour = b.dataset.colour;
        document.querySelectorAll('.swatch').forEach(function(x){ x.setAttribute('aria-checked', x===b); });
        $('#colourName').textContent = COLOURS[pdpState.colour].name;
        $('#pdpMedia').innerHTML = tee(pdpState.colour,{lines:p.lines,label:p.name+' tee in '+COLOURS[pdpState.colour].name});
      });
    });
    document.querySelectorAll('.size').forEach(function(b){
      b.addEventListener('click', function(){
        pdpState.size = b.dataset.size;
        document.querySelectorAll('.size').forEach(function(x){ x.setAttribute('aria-checked', x===b); });
        $('#sizeError').textContent = '';
      });
    });
    $('#qInc').addEventListener('click', function(){ pdpState.qty = Math.min(10, pdpState.qty+1); $('#qOut').textContent = pdpState.qty; });
    $('#qDec').addEventListener('click', function(){ pdpState.qty = Math.max(1, pdpState.qty-1); $('#qOut').textContent = pdpState.qty; });
    $('#addBtn').addEventListener('click', function(){
      if (!pdpState.size){ $('#sizeError').textContent = 'Choose a size to add this tee to your bag.'; document.querySelector('.size').focus(); return; }
      addToBag(pdpState.id, pdpState.colour, pdpState.size, pdpState.qty);
      toast('Added to bag: '+p.name+' ('+pdpState.size+')');
    });
  }

  function viewStory(){
    return '<div class="wrap"><section class="story"><div class="story-text">'+
      '<h1 class="display" tabindex="-1" style="font-size:clamp(3rem,7vw,6.5rem)">A good joke deserves a good shirt.</h1>'+
      '<p>Duck Brand started with a simple complaint: funny T-shirts were never well made, and well-made T-shirts were never funny. So we made the one we wanted to wear.</p>'+
      '<p>Every tee carries one pun, chosen carefully and set big. The cotton is heavy, the cut is considered, and the runs are small. Our duck, in its hard hat and shades, keeps an eye on quality from the hem.</p>'+
      '<p>Take the clothes seriously. Never the jokes.</p>'+
      '<div><a class="btn btn-primary" href="#/shop">Meet the flock</a></div></div>'+
      '<div class="story-art"><div class="made-badge" style="background:var(--panel)"><img src="'+DUCK+'" alt="The Duck Brand duck"></div></div></section></div>';
  }

  function viewHelp(){
    return '<div class="wrap" style="padding:clamp(48px,7vw,96px) 0;max-width:820px">'+
      '<h1 class="display" tabindex="-1" style="font-size:clamp(2.8rem,6vw,5rem);margin-bottom:40px">Shipping, returns and contact</h1>'+
      '<div class="acc">'+
      '<details open><summary>Shipping</summary><p>Delivery options, costs and estimated times are shown at checkout before you pay.</p></details>'+
      '<details><summary>Returns and exchanges</summary><p>Unworn tees with tags attached can be returned or swapped for another size. Get in touch and we’ll sort it out.</p></details>'+
      '<details><summary>Contact</summary><p>Questions about an order, sizing or a pun you think we should make? Email us at hello@duckbrand.example.</p></details>'+
      '</div></div>';
  }

  function viewNotFound(){
    return '<div class="wrap" style="padding:96px 0;display:flex;flex-direction:column;gap:20px;align-items:flex-start">'+
      '<h1 class="display" tabindex="-1" style="font-size:clamp(3rem,7vw,6rem)">This page has flown south.</h1>'+
      '<p class="lede">The link may be old or mistyped. Head back to the shop to find what you were after.</p>'+
      '<a class="btn btn-primary" href="#/shop">Back to the shop</a></div>';
  }

  /* ---------- router ---------- */
  function route(){
    var h = location.hash.replace(/^#\/?/, '');
    var parts = h.split('/');
    var main = $('#main'), name = parts[0] || 'home', html;
    if (name==='home') html = viewHome();
    else if (name==='shop') html = shopSection(true) + madeSection();
    else if (name==='tee') html = viewProduct(parts[1]);
    else if (name==='story') html = viewStory();
    else if (name==='help') html = viewHelp();
    else html = viewNotFound();
    main.innerHTML = html;
    document.querySelectorAll('.nav a[data-route]').forEach(function(a){
      if (a.dataset.route===name || (name==='tee' && a.dataset.route==='shop')) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
    if (name==='tee') bindProduct();
    document.title = name==='tee' && byId[parts[1]] ? byId[parts[1]].name+' — Duck Brand' :
      name==='story' ? 'Our story — Duck Brand' : name==='shop' ? 'Shop tees — Duck Brand' : 'Duck Brand — tees with one good joke each';
    window.scrollTo(0,0);
    if (name!=='home'){ var f = main.querySelector('[tabindex="-1"]'); if (f) f.focus({preventScroll:true}); }
  }
  window.addEventListener('hashchange', route);

  document.addEventListener('click', function(e){
    var w = e.target.closest('[data-waddle]');
    if (w){ w.style.animationDelay='0s'; w.classList.remove('waddle'); void w.offsetWidth; w.classList.add('waddle'); }
    var s = e.target.closest('[data-scroll]');
    if (s){ e.preventDefault(); $('#'+s.dataset.scroll).scrollIntoView({behavior:'smooth'}); setTimeout(function(){ $('#flockEmail').focus({preventScroll:true}); }, 400); }
  });

  $('#flockForm').addEventListener('submit', function(e){
    e.preventDefault();
    var v = $('#flockEmail').value.trim(), msg = $('#flockMsg');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ msg.textContent = 'Enter an email address like name@example.com.'; $('#flockEmail').focus(); return; }
    msg.textContent = 'You’re in. Welcome to the flock.'; $('#flockEmail').value='';
  });

  window.addEventListener('scroll', function(){ $('#header').classList.toggle('scrolled', window.scrollY > 8); }, { passive:true });
  $('#year').textContent = new Date().getFullYear();
  renderBag();
  route();
})();
</script>
</body>
</html>
